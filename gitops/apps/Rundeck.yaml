apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rundeck
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nsuarezdev/rundeck-platform.git   # <-- your repo
    targetRevision: main
    path: gitops/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: rundeck
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]